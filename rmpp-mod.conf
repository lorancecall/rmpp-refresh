# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-refresh
type=vellum
package=rmpp-refresh
default=0
short_ko=화면 새로고침 버튼
short_en=Screen refresh button
detail_ko=노트 툴바의 ⋯ 바로 위에 새로고침 버튼을 넣습니다.|누르면 화면 전체를 한 번 새로 그려 잔상을 지웁니다. 화면 키보드가 열릴 때도 한 번 새로 그립니다.
detail_en=Adds a Refresh button to the notebook toolbar, right above the three dots.|One tap redraws the whole screen and clears ghosting; it also redraws once when the on-screen keyboard opens.
